}

:root[data-theme="dark"]{

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;

button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto}
header.top{padding:18px 0 12px}

h1{margin:2px 0 0;font-size:23px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{padding:18px;background:var(--accent);color:var(--accent-ink);border:0}
.hero .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero .v{font-size:31px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.hero .s{opacity:.9;font-size:13.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.num{font-variant-numeric:tabular-nums}

.chart span{font-size:10px;color:var(--muted);margin-top:4px}

.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;min-height:56px}
.item:last-child{border-bottom:0}
.item .n{min-width:0;flex:1;overflow-wrap:anywhere}
.item .m{display:flex;gap:8px;align-items:center;margin-top:4px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.item b{white-space:nowrap}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}

.btn.d{color:var(--bad)}

.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:10px;min-height:52px}
.tabs button[aria-current=page]{color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:15;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(8,12,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.grow{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}.hint.w{color:var(--warn);font-weight:600}

.note{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);margin-bottom:12px;font-size:13.5px}
.tot{display:flex;justify-content:space-between;padding:10px 4px 6px;color:var(--muted);font-size:13px;font-weight:600}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.mrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}

.small{font-size:12.5px;color:var(--muted)}
body.ro .item,body.ro .item:hover{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

const LING=['Letare','Exaudi','Judika','Galatia','Efesus','Jeremia'];
const BLN=['Januari','Pebruari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','Nopember','Desember'];
const BS=['Jan','Peb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nop','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const KEY='pelean_taon_mobile_v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Math.round(n||0).toLocaleString('id-ID'); const rp=n=>'Rp '+num(n);
const pad=n=>String(n).padStart(2,'0');
const dOf=i=>{const [y,m,d]=i.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fT=i=>{if(!i)return'—';const d=dOf(i);return `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`};
const fTH=i=>{const d=dOf(i);return `${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`};
const fTs=i=>{if(!i)return'—';const d=dOf(i);return `${d.getDate()} ${BS[d.getMonth()]}`};
const sum=a=>a.reduce((s,x)=>s+x.jumlah,0);
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pill=l=>`<span class="pill" style="--c:var(--d-${l})">${l}</span>`;
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const li=l=>LING.indexOf(l);

let S={items:null,edited:false};
let ok=true;
function seed(){S={items:SEED.map(x=>({id:uid(),...x})),edited:false}}
function load(){if(READONLY){S={items:SEED.map(x=>({id:uid(),...x})),edited:false};return}try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(Array.isArray(o.items)){S=o;return}}}catch(e){ok=false}seed()}
function save(){if(READONLY)return;S.edited=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}}
const order=a=>a.map((x,i)=>[x,i]).sort((p,q)=>li(p[0].lingkungan)-li(q[0].lingkungan)||(p[0].tanggal||'9').localeCompare(q[0].tanggal||'9')||p[1]-q[1]).map(o=>o[0]);
const byDate=a=>a.map((x,i)=>[x,i]).sort((p,q)=>(p[0].tanggal||'9').localeCompare(q[0].tanggal||'9')||li(p[0].lingkungan)-li(q[0].lingkungan)||p[1]-q[1]).map(o=>o[0]);

function issues(){
  const o=[],g={};S.items.forEach(x=>(g[norm(x.nama)+'|'+x.lingkungan]=g[norm(x.nama)+'|'+x.lingkungan]||[]).push(x));
  S.items.forEach(x=>{
    if(!x.tanggal)o.push([x,'Tanggal kosong']);else if(dOf(x.tanggal).getDay()!==0)o.push([x,'Bukan hari Minggu']);
    if(!(x.jumlah>0))o.push([x,'Godangna kosong']);
    const k=g[norm(x.nama)+'|'+x.lingkungan];
    if(k.length>1){const s=k.filter(y=>y!==x&&y.tanggal===x.tanggal&&y.jumlah===x.jumlah).length;o.push([x,s?'Kemungkinan ganda (nama, tanggal, jumlah sama)':'Nama sama muncul '+k.length+'×'])}
  });return o;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function copy(t){
  try{await navigator.clipboard.writeText(t);toast('Tersalin. Tempel di WhatsApp');return}catch(e){}
  sheet(`<h3>Salin teks</h3><div class="fld"><textarea id="ct" rows="10" readonly>${esc(t)}</textarea></div><div class="row"><button class="btn p grow" data-close>Tutup</button></div>`,(m,c)=>{const ta=$('#ct',m);ta.focus();ta.select();m.querySelector('[data-close]').onclick=c});
}
function sheet(html,mount){
  const sc=document.createElement('div');sc.className='scrim';sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const close=()=>{sc.remove();document.removeEventListener('keydown',kd)};const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);sc.addEventListener('mousedown',e=>{if(e.target===sc)close()});
  document.body.appendChild(sc);mount&&mount(sc.firstChild,close);
}

/* ---- navigasi (hash) ---- */
const TABS=[['beranda','Beranda','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
 ['daftar','Daftar','<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'],
 ['minggu','Minggu','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
 ['rekap','Rekap','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>']];
if(!READONLY)TABS.push(['data','Data','<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/>']);
let view=(location.hash||'#beranda').slice(1);if(!TABS.some(t=>t[0]===view))view='beranda';
const F={q:'',l:''},M={l:'',next:false},R={l:''};
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(TABS.some(t=>t[0]===v)&&v!==view){view=v;render()}});

function render(){
  $('#tabs').innerHTML=TABS.map(([id,lb,ic])=>`<button data-v="${id}" ${id===view?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ic}</svg>${lb}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('#app').innerHTML={beranda:vB,daftar:vD,minggu:vM,rekap:vR,data:vA}[view]();
  $('#fabw').innerHTML=!READONLY&&(view==='daftar'||view==='beranda')?'<button class="fab" id="fab" aria-label="Tambah keluarga">+</button>':'';
  const f=$('#fab');f&&(f.onclick=()=>form());
  ({beranda:bB,daftar:bD,minggu:bM,rekap:bR,data:bA})[view]();
}
const head=(k,t)=>`<header class="top"><small>${k}</small><h1>${t}</h1></header>`;
const chipsL=(cur,id)=>`<div class="chips" id="${id}"><button class="chip" aria-pressed="${!cur}" data-l="">Semua</button>${LING.map(l=>`<button class="chip" aria-pressed="${cur===l}" data-l="${l}">${l}</button>`).join('')}</div>`;
const bindChips=(id,fn)=>$('#'+id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>fn(b.dataset.l));
const warnNote=()=>(!ok&&!READONLY?'<div class="note">Penyimpanan browser tidak tersedia. Perubahan hilang saat halaman ditutup.</div>':'');

/* ---- Beranda ---- */
function nextG(){const t=iso(new Date());const ds=[...new Set(S.items.filter(x=>x.tanggal>=t).map(x=>x.tanggal))].sort();return ds.length?{t:ds[0],a:order(S.items.filter(x=>x.tanggal===ds[0]))}:null}
function vB(){
  const tot=sum(S.items),n=S.items.length;const pl=LING.map(l=>{const a=S.items.filter(x=>x.lingkungan===l);return{l,n:a.length,t:sum(a)}});
  const mt=Array(12).fill(0);S.items.forEach(x=>{if(x.tanggal)mt[+x.tanggal.slice(5,7)-1]+=x.jumlah});const mx=Math.max(...mt,1);
  const ng=nextG(),is=issues(),last=S.items.map(x=>x.tanggal).filter(Boolean).sort().pop();
  return head('HKBP Ressort Hutaraja','Pelean Taon 2026')+warnNote()+`
  <div class="card hero"><div class="l">Total Godangna</div><div class="v">${rp(tot)}</div><div class="s">${n} keluarga · rata-rata ${rp(n?tot/n:0)}</div>${UPDATED?`<div class="s" style="margin-top:6px;opacity:.8">Diperbarui ${fT(UPDATED.slice(0,10))}</div>`:''}</div>
  <h2>Per lingkungan</h2><div class="card">${pl.map(r=>`<button class="lrow" data-l="${r.l}" style="--c:var(--d-${r.l})"><div class="t"><span>${pill(r.l)} <span class="small">${r.n} keluarga</span></span><b class="num">${rp(r.t)}</b></div><div class="bar"><i style="width:${tot?r.t/tot*100:0}%"></i></div></button>`).join('')}</div>
  <h2>Per bulan</h2><div class="card"><div class="chart">${mt.map((v,i)=>`<div title="${BLN[i]}: ${rp(v)}"><i style="height:${v/mx*100}%"></i><span>${BS[i][0]}</span></div>`).join('')}</div></div>
  <h2>${ng?'Minggu terdekat':'Jadwal tinting'}</h2><div class="card">${ng?`<div class="gh"><div><b>${fTH(ng.t)}</b><small>${ng.a.length} keluarga</small></div><b class="num">${rp(sum(ng.a))}</b></div>`+ng.a.map(x=>`<div class="item" style="cursor:default"><div class="n">${esc(x.nama)}<div class="m">${pill(x.lingkungan)}</div></div><b class="num">${rp(x.jumlah)}</b></div>`).join(''):`<div class="empty">Tidak ada jadwal setelah hari ini.${last?`<br>Tinting terakhir: ${fT(last)}.`:''}</div>`}</div>
  ${!READONLY&&is.length?`<h2>Cek data</h2><div class="card">${is.slice(0,6).map(([x,t])=>`<button class="item" data-e="${x.id}"><div class="n">${esc(x.nama)}<div class="m">${pill(x.lingkungan)} <span>${fT(x.tanggal)}</span></div><div class="hint w">${esc(t)}</div></div><b class="num">${rp(x.jumlah)}</b></button>`).join('')}</div>`:''}`;
}
function bB(){
  $('#app').querySelectorAll('.lrow').forEach(b=>b.onclick=()=>{F.l=b.dataset.l;F.q='';go('daftar')});
  $('#app').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(S.items.find(x=>x.id===b.dataset.e)));
}

/* ---- Daftar ---- */
function filt(){const q=F.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');return order(S.items.filter(x=>(!F.l||x.lingkungan===F.l)&&(!q||x.nama.toLowerCase().includes(q)||fT(x.tanggal).toLowerCase().includes(q)||(qd&&String(x.jumlah).includes(qd)))))}
function vD(){return head('Semua keluarga','Daftar Pelean')+`<div class="sticky"><input class="search" id="q" type="search" placeholder="Cari nama, tanggal, jumlah" value="${esc(F.q)}">${chipsL(F.l,'cl')}</div><div id="lst"></div>`}
function lst(){
  const a=filt();$('#lst').innerHTML=a.length?`<div class="tot"><span>${a.length} keluarga</span><span class="num">${rp(sum(a))}</span></div><div class="card">${a.map(x=>`<button class="item" data-e="${x.id}"><div class="n">${esc(x.nama)}<div class="m">${pill(x.lingkungan)} <span>${fT(x.tanggal)}</span></div></div><b class="num">${rp(x.jumlah)}</b></button>`).join('')}</div>`:'<div class="card empty">Tidak ada yang cocok.</div>';
  $('#lst').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(S.items.find(x=>x.id===b.dataset.e)));
}
function bD(){lst();$('#q').oninput=e=>{F.q=e.target.value;lst()};bindChips('cl',l=>{F.l=l;render()})}

/* ---- Minggu ---- */
function vM(){
  const t=iso(new Date());const a=byDate(S.items.filter(x=>(!M.l||x.lingkungan===M.l)&&(!M.next||x.tanggal>=t)));
  const g={};a.forEach(x=>(g[x.tanggal]=g[x.tanggal]||[]).push(x));const ds=Object.keys(g).sort();const nx=nextG()?.t;
  return head('Untuk warta jemaat','Jadwal Minggu')+`<div class="sticky">${chipsL(M.l,'cm')}<div class="chips"><button class="chip" id="nx" aria-pressed="${M.next}">Mulai hari ini</button></div></div>`+
  (ds.length?ds.map(d=>`<div class="card" style="margin-bottom:12px;${d===nx?'border-color:var(--accent)':''}"><div class="gh"><div><b>${fTH(d)}</b><small>${g[d].length} keluarga · ${rp(sum(g[d]))}</small></div><button class="btn s" data-c="${d}">Salin</button></div>${g[d].map(x=>`<div class="item" style="cursor:default"><div class="n">${esc(x.nama)}<div class="m">${pill(x.lingkungan)}</div></div><b class="num">${rp(x.jumlah)}</b></div>`).join('')}</div>`).join(''):'<div class="card empty">Tidak ada jadwal.</div>');
}
function bM(){
  bindChips('cm',l=>{M.l=l;render()});$('#nx').onclick=()=>{M.next=!M.next;render()};
  $('#app').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.c,a=order(S.items.filter(x=>x.tanggal===d&&(!M.l||x.lingkungan===M.l)));
    copy(`*PELEAN TAON ${fTH(d).toUpperCase()}*\nRuas HKBP Hutaraja\n\n`+a.map((x,i)=>`${i+1}. ${x.nama} (${x.lingkungan}) - ${rp(x.jumlah)}`).join('\n')+`\n\nJumlah: ${a.length} keluarga, ${rp(sum(a))}`);
  });
}

/* ---- Rekap ---- */
function vR(){
  const a=S.items.filter(x=>!R.l||x.lingkungan===R.l);const t=Array(12).fill(0),n=Array(12).fill(0);a.forEach(x=>{if(x.tanggal){const m=+x.tanggal.slice(5,7)-1;t[m]+=x.jumlah;n[m]++}});const mx=Math.max(...t,1);
  return head('Godangna per bulan','Rekapitulasi')+chipsL(R.l,'cr')+`<div class="card hero" style="margin-bottom:12px"><div class="l">${R.l||'Semua lingkungan'}</div><div class="v">${rp(sum(a))}</div><div class="s">${a.length} keluarga</div></div>
  <div class="card">${t.map((v,i)=>`<div class="mrow"><b>${BLN[i].slice(0,3)==='Peb'?'Peb':BS[i]}</b><div><div class="bar" style="--c:var(--accent)"><i style="width:${v/mx*100}%"></i></div><div class="small">${n[i]} keluarga</div></div><b class="num">${v?rp(v):'–'}</b></div>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn p grow" id="cp">Salin rekap</button></div>`;
}
function bR(){
  bindChips('cr',l=>{R.l=l;render()});
  $('#cp').onclick=()=>{
    const pl=LING.map(l=>{const a=S.items.filter(x=>x.lingkungan===l);return `${l}: ${a.length} keluarga, ${rp(sum(a))}`});
    copy(`*REKAPITULASI PELEAN TAON 2026*\nRuas HKBP Hutaraja\n\n`+pl.join('\n')+`\n\n*Total: ${S.items.length} keluarga, ${rp(sum(S.items))}*`);
  };
}

/* ---- Form tambah/ubah ---- */
let last={l:'Letare',t:''};
function form(x){
  if(READONLY)return;
  const e=!!x,v=x||{nama:'',lingkungan:last.l,jumlah:'',tanggal:last.t};
  sheet(`<h3>${e?'Ubah keluarga':'Tambah keluarga'}</h3>
  <div class="fld"><label for="fn">Nama keluarga</label><input id="fn" value="${esc(v.nama)}" placeholder="Kel.Am.Nama/Br Boru" autocomplete="off"></div>
  <div class="two"><div class="fld"><label for="fl">Lingkungan</label><select id="fl">${LING.map(l=>`<option ${v.lingkungan===l?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="fld"><label for="ft">Tanggal tinting</label><input id="ft" type="date" value="${esc(v.tanggal)}"></div></div><div class="hint" id="fth" style="margin:-6px 0 10px"></div>
  <div class="fld"><label for="fj">Godangna (Rp)</label><input id="fj" inputmode="numeric" value="${v.jumlah===''?'':num(v.jumlah)}" placeholder="300.000">
  <div class="chips" style="padding-top:8px">${[150000,200000,250000,300000,400000,500000,1000000].map(n=>`<button type="button" class="chip" data-q="${n}">${n>=1e6?'1jt':n/1000+'rb'}</button>`).join('')}</div></div>
  <div class="hint w" id="fe"></div>
  <div class="row" style="margin-top:8px"><button class="btn" data-x>Batal</button>${e?'<button class="btn d" data-del>Hapus</button>':''}<button class="btn p grow" data-ok>Simpan</button></div>`,(m,close)=>{
    const j=$('#fj',m),t=$('#ft',m);
    const h=()=>{const el=$('#fth',m);if(!t.value){el.textContent='';return}const d=dOf(t.value).getDay();el.textContent=HARI[d]+(d?' (bukan hari Minggu)':'');el.className='hint'+(d?' w':'')};t.oninput=h;h();
    j.oninput=()=>{const d=j.value.replace(/\D/g,'');j.value=d?num(+d):''};
    m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{j.value=num(+b.dataset.q)});
    m.querySelector('[data-x]').onclick=close;
    const del=m.querySelector('[data-del]');if(del){let arm=false;del.onclick=()=>{if(!arm){arm=true;del.textContent='Ketuk lagi untuk hapus';return}S.items=S.items.filter(i=>i!==x);save();close();render();toast('Dihapus')}}
    m.querySelector('[data-ok]').onclick=()=>{
      const r={nama:$('#fn',m).value.replace(/\s+/g,' ').trim(),lingkungan:$('#fl',m).value,jumlah:+(j.value.replace(/\D/g,'')||0),tanggal:t.value};
      if(!r.nama){$('#fe',m).textContent='Nama keluarga wajib diisi.';return}
      if(!(r.jumlah>0)){$('#fe',m).textContent='Godangna harus lebih dari 0.';return}
      if(e)Object.assign(x,r);else S.items.push({id:uid(),...r});last={l:r.lingkungan,t:r.tanggal};save();close();render();toast(e?'Perubahan disimpan':'Keluarga ditambahkan');
    };
    if(!e)$('#fn',m).focus();
  });
}
/* ---- Data & Publikasi (pengurus) ---- */
function exportObj(){return{updated:new Date().toISOString(),items:S.items.map(({nama,lingkungan,jumlah,tanggal})=>({nama,lingkungan,jumlah,tanggal}))}}
function okItems(a){return Array.isArray(a)&&a.every(x=>x&&typeof x.nama==='string'&&LING.includes(x.lingkungan)&&Number.isFinite(+x.jumlah)&&typeof x.tanggal==='string')}
function vA(){return head('Mode pengurus','Data & Publikasi')+`<div class="note">Perubahan Bapak tersimpan di perangkat ini. Agar jemaat ikut melihatnya, unduh <b>data.json</b> lalu unggah ke GitHub (ganti file lama).</div>
 <div class="card" style="padding:16px"><div class="small" style="margin-bottom:10px">${S.items.length} keluarga · ${rp(sum(S.items))}</div>
 <div class="row"><button class="btn p grow" id="aX">Unduh data.json</button><button class="btn grow" id="aC">Salin JSON</button></div></div>
 <h2>Pulihkan</h2><div class="card" style="padding:16px"><div class="row"><button class="btn grow" id="aI">Impor data.json</button><button class="btn grow" id="aP">Muat dari situs</button></div><input type="file" id="aF" accept=".json,application/json" hidden>
 <div class="row" style="margin-top:10px"><button class="btn d grow" id="aR">Kembali ke data awal</button></div><div class="hint">“Muat dari situs” mengambil data.json yang sedang tampil ke jemaat dan menggantikan data di perangkat ini.</div></div>`}
function bA(){
  $('#aX').onclick=()=>{const b=new Blob([JSON.stringify(exportObj(),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('data.json diunduh')};
  $('#aC').onclick=()=>copy(JSON.stringify(exportObj(),null,1));
  $('#aI').onclick=()=>$('#aF').click();
  $('#aF').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!okItems(o.items))throw 0;S.items=o.items.map(x=>({id:uid(),nama:x.nama,lingkungan:x.lingkungan,jumlah:+x.jumlah,tanggal:x.tanggal}));save();render();toast('Data diimpor: '+S.items.length+' keluarga')}catch(_){toast('File data.json tidak valid')}};r.readAsText(f)};
  $('#aP').onclick=async()=>{try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});const o=await r.json();if(!okItems(o.items))throw 0;S.items=o.items.map(x=>({id:uid(),...x}));save();render();toast('Dimuat dari situs')}catch(_){toast('Tidak bisa memuat data.json dari situs')}};
  const R2=$('#aR');let arm=false;R2.onclick=()=>{if(!arm){arm=true;R2.textContent='Ketuk lagi untuk kembali ke data awal';return}seed();save();render();toast('Data awal dikembalikan')};
}
load();render();
if(READONLY){fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(o=>{if(okItems(o.items)){S.items=o.items.map(x=>({id:uid(),...x}));if(o.updated)UPDATED=o.updated;render()}}).catch(()=>{})}
</script>
</body>
</html>
